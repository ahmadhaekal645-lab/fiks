<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armonia Excursions — Travel Agency in Greece</title>
<meta name="description" content="The most popular and trusted travel agency in Greece.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="hero">

  <header class="bar">
    <a class="brand" href="#" aria-label="Armonia Excursions — beranda">
      <svg class="brand-mark" viewBox="0 0 14 31" fill="none" aria-hidden="true">
        <path d="M7 1.6 5.6 5.4 8.6 5.4 7 1.6Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
        <path d="M7 5.4V17" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
        <path d="M1.6 9.2 7 11.4l5.4-2.2" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 17 2.4 29.6M7 17l4.6 12.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </a>

    <button class="lang" type="button" aria-label="Pilih bahasa: English">
      <svg class="lang-globe" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.1"/>
        <path d="M1.8 8h12.4M8 1.8c1.7 1.8 2.6 3.9 2.6 6.2S9.7 12.4 8 14.2C6.3 12.4 5.4 10.3 5.4 8S6.3 3.6 8 1.8Z" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>English</span>
      <svg class="lang-caret" viewBox="0 0 12 8" fill="none" aria-hidden="true">
        <path d="M1.5 2.2 6 6.2l4.5-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <nav class="nav" id="nav">
      <a href="#">Home</a>
      <a href="#">About us</a>
      <a href="#">Transfers</a>
      <a href="#">Tours</a>
      <a href="#">Contacts</a>
      <a class="btn btn-in-menu" href="#">Book a Tour</a>
    </nav>

    <a class="btn btn-bar" href="#">Book a Tour</a>

    <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="head">
    <h1 class="title">ARMONIA<br>EXCURSIONS</h1>

    <p class="note">The most popular and trusted<br>travel agency in Greece</p>

    <a class="explore" href="#">
      <span class="explore-label">Explore destinations</span>
      <svg class="explore-arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M3 3l8 8M11 4.6V11H4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <figure class="shot">
    <img src="assets/img/hero-armonia.jpg"
         alt="Reruntuhan Kuil Poseidon di puncak bukit hijau Cape Sounion, Yunani"
         width="1496" height="492">
  </figure>

</section>

<div class="scrim" id="scrim" hidden></div>

<script src="js/main.js"></script>
</body>
</html>
